# Builds a signed arm64 APK of Dolphin Dualscreen on every push to main.
# The APK appears under Actions -> the run -> Artifacts.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password (often the same as KEYSTORE_PASSWORD)

name: Android APK

on:
  push:
    # main: the build Bill installs. Work branches: the build plus screenshots on an emulator.
    branches-ignore: [upstream]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Check signing secrets
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # Full history of this repo (small) so the build can name its version from git.
          fetch-depth: 0

      - name: Fetch submodules
        run: |
          # Windows-only externals that the Android build never uses.
          skip=" Externals/Qt Externals/FFmpeg-bin Externals/wil "
          need=""
          for p in $(git config --file .gitmodules --get-regexp '\.path$' | awk '{print $2}'); do
            case "$skip" in *" $p "*) ;; *) need="$need $p" ;; esac
          done
          git submodule update --init --recursive --depth 1 --jobs 8 -- $need \
            || git submodule update --init --recursive --jobs 8 -- $need
          # The SDL submodule ships an example Android project whose Gradle wrapper jar fails
          # setup-gradle's checksum validation. We never use that project, so drop the jar
          # and keep validation on for everything else.
          rm -f Externals/SDL/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses and install Dolphin's NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' Source/Android/app/build.gradle.kts)
          echo "NDK $ndk"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Install ccache
        run: sudo apt-get update -q && sudo apt-get install -y -q ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-arm64-${{ github.run_id }}
          restore-keys: ccache-arm64-

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        working-directory: Source/Android
        env:
          # Passed to Gradle as project properties without putting passwords on the command line.
          ORG_GRADLE_PROJECT_keystore: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_storepass: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_keyalias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_keypass: ${{ secrets.KEY_PASSWORD }}
        run: |
          ccache -z
          ./gradlew --no-daemon assembleRelease \
            -Pabis=arm64-v8a \
            -PversionCodeOverride=${{ github.run_number }} \
            -Pccache \
            -PskipNativeTests
          ccache -s

      - name: Collect APK
        run: |
          mkdir -p out
          apk=$(ls Source/Android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "out/Dolphin-Dualscreen-build${{ github.run_number }}.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          "$apksigner" verify --print-certs "out/Dolphin-Dualscreen-build${{ github.run_number }}.apk" | grep -i 'SHA-256'
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: Dolphin-Dualscreen-build${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

  screenshots:
    # Work branches only: an Android 13 emulator shaped like the Thor's top screen photographs the game list,
    # settings and the bottom-screen preview in every theme (Tools/dualscreen/screenshots.sh). The APK is
    # arm64; the emulator's ARM translation runs it, which is enough for the menus (no game is started).
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: Dolphin-Dualscreen-build${{ github.run_number }}
          path: apk

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start an Android 13 emulator (1920x1080, like the Thor's top screen)
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/emulator:$SDK/platform-tools:$PATH
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p $ANDROID_AVD_HOME shots
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "emulator" "platform-tools" "system-images;android-33;google_apis;x86_64" > shots/sdk.txt 2>&1
          echo no | avdmanager create avd -n thor -k "system-images;android-33;google_apis;x86_64" -d pixel_6 --force >> shots/sdk.txt 2>&1
          printf 'hw.lcd.width=1920\nhw.lcd.height=1080\nhw.lcd.density=400\nhw.keyboard=yes\n' >> $ANDROID_AVD_HOME/thor.avd/config.ini
          nohup emulator -avd thor -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot \
            -memory 4096 -cores 2 -camera-back none -camera-front none > shots/emulator.txt 2>&1 &
          timeout 900 adb wait-for-device
          for i in $(seq 1 240); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          for i in $(seq 1 60); do adb shell pm path android > /dev/null 2>&1 && break; sleep 5; done
          sleep 20
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 0

      - name: Take the screenshots
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          bash Tools/dualscreen/screenshots.sh "$(ls apk/*.apk | head -n1)" shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-build${{ github.run_number }}
          path: shots

